<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#09061a">
  <title>Altena Studio | Official Links</title>
  <meta name="description" content="Official Altena Studio links for YouTube, Instagram, TikTok, Facebook and email contact.">
  <meta property="og:title" content="Altena Studio | Official Links">
  <meta property="og:description" content="Verified global stories, authentic footage, clean edits and clear sources.">
  <meta property="og:type" content="website">
  <style>
    :root{color-scheme:dark;--bg:#09061a;--card:rgba(22,15,48,.84);--line:rgba(255,255,255,.14);--text:#f8f7ff;--muted:#b8b4cc;--purple:#9b5cff;--blue:#44b8ff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px 18px;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 18% 8%,#38216e 0,transparent 37%),radial-gradient(circle at 88% 82%,#07375b 0,transparent 36%),var(--bg)}
    main{width:min(100%,460px);padding:30px 22px 24px;border:1px solid var(--line);border-radius:30px;background:var(--card);box-shadow:0 28px 80px rgba(0,0,0,.45);backdrop-filter:blur(18px)}
    .mark{width:82px;height:82px;margin:0 auto 17px;border-radius:24px;display:grid;place-items:center;font-size:46px;font-weight:900;letter-spacing:-4px;background:linear-gradient(145deg,var(--purple),#765bff 48%,var(--blue));box-shadow:0 14px 35px rgba(127,85,255,.35)}
    h1{margin:0;text-align:center;font-size:30px;letter-spacing:-.7px}
    .handle{margin:7px 0 16px;text-align:center;color:#d6cffb;font-weight:650}
    .about{margin:0 auto 25px;max-width:360px;text-align:center;color:var(--muted);font-size:15px;line-height:1.55}
    nav{display:grid;gap:12px}
    a{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:62px;padding:15px 18px;border:1px solid var(--line);border-radius:18px;color:var(--text);text-decoration:none;font-weight:750;background:rgba(255,255,255,.065);transition:transform .18s ease,border-color .18s ease,background .18s ease}
    a:first-child{background:linear-gradient(115deg,#7f46ed,#327fdd);border-color:transparent}
    a:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.32);background-color:rgba(255,255,255,.11)}
    a:focus-visible{outline:3px solid #fff;outline-offset:3px}
    .label{display:flex;align-items:center;gap:12px}
    .icon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(0,0,0,.22);font-size:15px}
    .arrow{opacity:.75;font-size:20px}
    footer{margin-top:24px;text-align:center;color:#88839f;font-size:12px}
    @media(prefers-reduced-motion:reduce){a{transition:none}}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">A</div>
    <h1>Altena Studio</h1>
    <p class="handle">@AltenaStudio</p>
    <p class="about">Verified global stories across science, technology, culture and world news. Authentic footage, clean edits and clear sources.</p>
    <nav aria-label="Official Altena Studio social and contact links">
      <a href="https://www.youtube.com/@AltenaStudio?sub_confirmation=1" target="_blank" rel="noopener noreferrer"><span class="label"><span class="icon" aria-hidden="true">▶</span>Subscribe on YouTube</span><span class="arrow" aria-hidden="true">›</span></a>
      <a href="https://www.instagram.com/altenastudio/" target="_blank" rel="noopener noreferrer"><span class="label"><span class="icon" aria-hidden="true">◎</span>Follow on Instagram</span><span class="arrow" aria-hidden="true">›</span></a>
      <a href="https://www.tiktok.com/@altena.studio" target="_blank" rel="noopener noreferrer"><span class="label"><span class="icon" aria-hidden="true">♪</span>Follow on TikTok</span><span class="arrow" aria-hidden="true">›</span></a>
      <a href="https://www.facebook.com/profile.php?id=61592450591617" target="_blank" rel="noopener noreferrer"><span class="label"><span class="icon" aria-hidden="true">f</span>Follow on Facebook</span><span class="arrow" aria-hidden="true">›</span></a>
      <a href="mailto:altenastudio@gmail.com" aria-label="Email Altena Studio at altenastudio@gmail.com"><span class="label"><span class="icon" aria-hidden="true">@</span>altenastudio@gmail.com</span><span class="arrow" aria-hidden="true">›</span></a>
    </nav>
    <footer>Official Altena Studio links</footer>
  </main>
</body>
</html>
