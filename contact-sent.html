<!doctype html>
<html lang="en-CA" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Message Sent | Ramtin Mojtahedi</title>
  <style>
    :root{color-scheme:light dark;--bg:#f3f0e9;--card:#fffdf8;--ink:#14221e;--muted:#63706b;--line:#d6d0c4;--accent:#08705a}
    @media(prefers-color-scheme:dark){:root{--bg:#07110e;--card:#0d1b17;--ink:#f1faf6;--muted:#a9bbb4;--line:#293d35;--accent:#78dfbd}}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(620px,100%);padding:42px;border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:0 28px 80px rgba(0,0,0,.14);text-align:center}.check{width:62px;height:62px;margin:0 auto 20px;display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-size:30px;font-weight:800}h1{margin:0;font-size:clamp(2rem,6vw,3.6rem);letter-spacing:-.05em}p{margin:14px auto 0;max-width:470px;color:var(--muted);line-height:1.65}a{display:inline-flex;margin-top:24px;padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:800;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <div class="check" aria-hidden="true">✓</div>
    <h1>Message sent.</h1>
    <p>Thank you. Your message has been submitted directly to Ramtin Mojtahedi.</p>
    <a href="https://ramtin-mojtahedi.github.io/#contact">Return to the website</a>
  </main>
</body>
</html>
