name: Contact form endpoint health check

on:
  push:
    branches:
      - main
    paths:
      - assets/contact-form.js
      - _includes/site-part-4.html
      - .github/workflows/contact-form-activation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contact-form-health
  cancel-in-progress: true

jobs:
  verify-contact-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4

      - name: Verify no-activation contact endpoint
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl \
            --location \
            --silent \
            --show-error \
            --retry 4 \
            --retry-delay 5 \
            --retry-all-errors \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --data-urlencode 'to=MojtahediRamtn@gmail.com' \
            --data-urlencode 'name=Automated website health check' \
            --data-urlencode 'email=Ramtin.Mojtahedi@utoronto.ca' \
            --data-urlencode 'subject=Contact endpoint health check' \
            --data-urlencode 'message=Automated non-delivery health check.' \
            --data-urlencode 'hp_email=automated-health-check' \
            'https://email.gosecureserver.in/api/send.php')"

          echo "HTTP status: ${status}"
          head -c 1200 "$response_file" || true
          echo

          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "Contact endpoint returned HTTP ${status}." >&2
            exit 1
          fi

          {
            echo '### Contact-form endpoint is reachable'
            echo '- Endpoint: available'
            echo '- Recipient activation: not required by this integration'
            echo '- Honeypot health-check payload: accepted without sending a visitor message'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record successful health check
        shell: bash
        run: |
          set -euo pipefail
          checked_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > .github/contact-endpoint-status.json <<EOF
          {
            "status": "operational",
            "checked_at": "${checked_at}",
            "endpoint": "https://email.gosecureserver.in/api/send.php",
            "recipient": "MojtahediRamtn@gmail.com",
            "public_email": "Ramtin.Mojtahedi@utoronto.ca",
            "recipient_activation_required": false
          }
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/contact-endpoint-status.json
          git commit -m 'Record contact endpoint health' || exit 0
          git push