name: Finalize exact contact recipient

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-exact-contact-recipient.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact recipient spelling and cache release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('assets/contact-form.js'): [
                  ("Private recipient used only for contact-form delivery: mojtahediramtin@gmail.com",
                   "Private recipient used only for contact-form delivery: MojtahediRamtin@gmail.com"),
                  ("const recipient = ['mojtahedi', 'ramtin', '@gmail.com'].join('');",
                   "const recipient = ['Mojtahedi', 'Ramtin', '@gmail.com'].join('');"),
              ],
              Path('.github/workflows/contact-form-activation.yml'): [
                  ('mojtahediramtin@gmail.com', 'MojtahediRamtin@gmail.com'),
              ],
              Path('scripts/validate_website.py'): [
                  ('PRIVATE_RECIPIENT = "".join(("mojtahedi", "ramtin", "@gmail.com"))',
                   'PRIVATE_RECIPIENT = "".join(("Mojtahedi", "Ramtin", "@gmail.com"))'),
                  ('private_fragments = ("mojtahedi", "ramtin", "@gmail.com")',
                   'private_fragments = ("Mojtahedi", "Ramtin", "@gmail.com")'),
                  ('if PRIVATE_RECIPIENT in contact.lower() or PRIVATE_RECIPIENT in index.lower():',
                   'if PRIVATE_RECIPIENT.lower() in contact.lower() or PRIVATE_RECIPIENT.lower() in index.lower():'),
              ],
              Path('index.html'): [
                  ('assets/contact-form.js?v=20260727-3', 'assets/contact-form.js?v=20260727-4'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          script = Path('assets/contact-form.js').read_text(encoding='utf-8')
          assert "['Mojtahedi', 'Ramtin', '@gmail.com']" in script
          assert 'Thanks for your message. We will contact you shortly. Thanks!' in script

          contact = Path('_includes/site-part-4.html').read_text(encoding='utf-8')
          assert 'maxlength=' not in contact.lower()
          assert 'minlength=' not in contact.lower()
          PY

      - name: Validate final website sources
        run: |
          python scripts/validate_website.py
          node --check assets/contact-form.js

      - name: Commit final contact release and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-exact-contact-recipient.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/contact-form.js \
            .github/workflows/contact-form-activation.yml \
            scripts/validate_website.py \
            index.html \
            .github/workflows/finalize-exact-contact-recipient.yml
          git commit -m 'Finalize exact contact recipient and unlimited form'
          git pull --rebase origin main
          git push origin HEAD:main
