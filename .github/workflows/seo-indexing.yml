name: SEO indexing and health check

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"

permissions:
  contents: read
  pages: read

concurrency:
  group: seo-indexing-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the deployed revision
        if: github.event_name != 'schedule'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.repository.default_branch }}

      - name: Capture the expected Pages revision
        if: github.event_name != 'schedule'
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for the exact GitHub Pages build
        if: github.event_name != 'schedule'
        env:
          EXPECTED_SHA: ${{ steps.revision.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          build_json="$(mktemp)"
          expected_build_status=""

          for attempt in $(seq 1 60); do
            if curl \
              --connect-timeout 5 \
              --max-time 20 \
              --fail \
              --location \
              --silent \
              --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$build_json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds?per_page=100"; then
              expected_build_status="$(
                jq -r --arg sha "$EXPECTED_SHA" \
                  '[.[] | select(.commit == $sha)][0].status // empty' \
                  "$build_json"
              )"
              echo "Pages build ${attempt}: ${EXPECTED_SHA} (${expected_build_status:-not listed})"

              if [[ "$expected_build_status" == "built" ]]; then
                echo "Exact Pages build is published."
                exit 0
              fi

              if [[ "$expected_build_status" == "errored" ]]; then
                jq -r --arg sha "$EXPECTED_SHA" \
                  '[.[] | select(.commit == $sha)][0].error.message // "GitHub Pages reported an unknown build error."' \
                  "$build_json" >&2
                exit 1
              fi
            fi
            sleep 10
          done

          echo "Timed out waiting for Pages revision ${EXPECTED_SHA}; status was ${expected_build_status:-not listed}." >&2
          exit 1

      - name: Verify the exact deployed search files
        if: github.event_name != 'schedule'
        id: deployed_search
        env:
          EXPECTED_SHA: ${{ steps.revision.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/indexnow-${EXPECTED_SHA}.json"
          deployed_sitemap="$RUNNER_TEMP/sitemap-${EXPECTED_SHA}.xml"
          deployed_publications="$RUNNER_TEMP/publications-${EXPECTED_SHA}.json"
          deployed_bibtex="$RUNNER_TEMP/publications-${EXPECTED_SHA}.bib"
          deployed_atom="$RUNNER_TEMP/publications-${EXPECTED_SHA}.atom.xml"
          deployed_scholarly_pages="$RUNNER_TEMP/scholarly-pages-${EXPECTED_SHA}.json"
          deployed=false

          for attempt in $(seq 1 20); do
            if curl \
              --connect-timeout 5 \
              --max-time 20 \
              --fail \
              --location \
              --silent \
              --show-error \
              --output "$manifest" \
              "https://ramtin-mojtahedi.github.io/indexnow.json" \
              && curl \
                --connect-timeout 5 \
                --max-time 20 \
                --fail \
                --location \
                --silent \
                --show-error \
                --output "$deployed_sitemap" \
                "https://ramtin-mojtahedi.github.io/sitemap.xml" \
              && curl \
                --connect-timeout 5 \
                --max-time 20 \
                --fail \
                --location \
                --silent \
                --show-error \
                --output "$deployed_publications" \
                "https://ramtin-mojtahedi.github.io/publications.json" \
              && curl \
                --connect-timeout 5 \
                --max-time 20 \
                --fail \
                --location \
                --silent \
                --show-error \
                --output "$deployed_bibtex" \
                "https://ramtin-mojtahedi.github.io/publications.bib" \
              && curl \
                --connect-timeout 5 \
                --max-time 20 \
                --fail \
                --location \
                --silent \
                --show-error \
                --output "$deployed_atom" \
                "https://ramtin-mojtahedi.github.io/publications.atom.xml" \
              && curl \
                --connect-timeout 5 \
                --max-time 20 \
                --fail \
                --location \
                --silent \
                --show-error \
                --output "$deployed_scholarly_pages" \
                "https://ramtin-mojtahedi.github.io/scholarly-pages.json" \
              && cmp --silent indexnow.json "$manifest" \
              && cmp --silent sitemap.xml "$deployed_sitemap" \
              && cmp --silent publications.json "$deployed_publications" \
              && cmp --silent publications.bib "$deployed_bibtex" \
              && cmp --silent publications.atom.xml "$deployed_atom" \
              && cmp --silent scholarly-pages.json "$deployed_scholarly_pages"; then
              deployed=true
              break
            fi
            sleep 6
          done

          if [[ "$deployed" != "true" ]]; then
            echo "Pages built ${EXPECTED_SHA}, but its search files did not reach the public site in time." >&2
            exit 1
          fi

          echo "manifest_path=${manifest}" >> "$GITHUB_OUTPUT"
          {
            echo "- GitHub Pages revision: ${EXPECTED_SHA}"
            echo "- Deployed sitemap, IndexNow manifest, citation exports, and Atom feed: exact"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify public website and SEO files
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://ramtin-mojtahedi.github.io/"
            "https://ramtin-mojtahedi.github.io/about/"
            "https://ramtin-mojtahedi.github.io/research/"
            "https://ramtin-mojtahedi.github.io/publications/"
            "https://ramtin-mojtahedi.github.io/robots.txt"
            "https://ramtin-mojtahedi.github.io/sitemap.xml"
            "https://ramtin-mojtahedi.github.io/indexnow.json"
            "https://ramtin-mojtahedi.github.io/publications.json"
            "https://ramtin-mojtahedi.github.io/publications.bib"
            "https://ramtin-mojtahedi.github.io/publications.atom.xml"
            "https://ramtin-mojtahedi.github.io/scholarly-pages.json"
            "https://ramtin-mojtahedi.github.io/898f0caec5d8b22a095db2a4afa88722.txt"
          )

          for url in "${urls[@]}"; do
            echo "Checking ${url}"
            curl \
              --connect-timeout 5 \
              --max-time 20 \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 8 \
              --retry-delay 10 \
              --retry-all-errors \
              "${url}" > /dev/null
          done

          {
            echo "### SEO health check passed"
            echo "- Website: available"
            echo "- Publication pages: available"
            echo "- robots.txt: available"
            echo "- sitemap.xml: available"
            echo "- IndexNow manifest: available"
            echo "- Biography and research hub: available"
            echo "- Publication JSON, BibTeX, Atom, and scholarly-page manifest: available"
            echo "- IndexNow key: available"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify IndexNow search engines
        if: github.event_name != 'schedule'
        env:
          DEPLOYED_MANIFEST: ${{ steps.deployed_search.outputs.manifest_path }}
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --connect-timeout 5 \
            --max-time 30 \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --header "Content-Type: application/json; charset=utf-8" \
            --data-binary "@${DEPLOYED_MANIFEST}" \
            "https://api.indexnow.org/indexnow"

          echo "- IndexNow: homepage and publication pages submitted" >> "$GITHUB_STEP_SUMMARY"
