name: SEO indexing and health check

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"

permissions:
  contents: read

concurrency:
  group: seo-indexing
  cancel-in-progress: true

jobs:
  verify-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out indexing manifest
        uses: actions/checkout@v4

      - name: Wait for GitHub Pages publication
        if: github.event_name == 'push'
        run: sleep 75

      - name: Verify public website and SEO files
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://ramtin-mojtahedi.github.io/"
            "https://ramtin-mojtahedi.github.io/robots.txt"
            "https://ramtin-mojtahedi.github.io/sitemap.xml"
            "https://ramtin-mojtahedi.github.io/publications.json"
            "https://ramtin-mojtahedi.github.io/publications/"
            "https://ramtin-mojtahedi.github.io/publications.bib"
            "https://ramtin-mojtahedi.github.io/scholarly-pages.json"
            "https://ramtin-mojtahedi.github.io/898f0caec5d8b22a095db2a4afa88722.txt"
          )

          for url in "${urls[@]}"; do
            echo "Checking ${url}"
            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 8 \
              --retry-delay 10 \
              --retry-all-errors \
              "${url}" > /dev/null
          done

          {
            echo "### SEO health check passed"
            echo "- Website: available"
            echo "- robots.txt: available"
            echo "- sitemap.xml: available"
            echo "- publications.json: available"
            echo "- publication index and BibTeX: available"
            echo "- IndexNow key: available"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify IndexNow search engines
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --header "Content-Type: application/json; charset=utf-8" \
            --data-binary @indexnow.json \
            https://api.indexnow.org/indexnow

          echo "- IndexNow: homepage and all scholarly pages submitted" >> "$GITHUB_STEP_SUMMARY"
