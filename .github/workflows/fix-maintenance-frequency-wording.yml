name: Align maintenance frequency wording

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-maintenance-frequency-wording.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update frequency wording
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/update_publications.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '"""Weekly publication sync. Curated CV records are never deleted."""':
                  '"""Twice-weekly publication sync. Curated CV records are never deleted."""',
              'CV baseline preserved; external scholarly sources checked weekly.':
                  'CV baseline preserved; external scholarly sources checked twice weekly.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected text was not found: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          metrics_path = Path('_data/site_metrics.json')
          metrics = metrics_path.read_text(encoding='utf-8')
          metrics = metrics.replace(
              'CV baseline preserved; external scholarly sources checked weekly.',
              'CV baseline preserved; external scholarly sources checked twice weekly.',
          )
          metrics_path.write_text(metrics, encoding='utf-8')
          PY

      - name: Commit wording and remove one-time workflow
        run: |
          set -euo pipefail
          rm .github/workflows/fix-maintenance-frequency-wording.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/update_publications.py \
            _data/site_metrics.json \
            .github/workflows/fix-maintenance-frequency-wording.yml
          git commit -m 'Use twice-weekly scholarly update wording'
          git pull --rebase origin main
          git push origin HEAD:main
