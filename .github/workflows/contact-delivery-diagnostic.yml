name: One-time contact delivery diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/contact-delivery-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send a real diagnostic message through the current form endpoint
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl \
            --location \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --data-urlencode 'to=ramtinrms@gmail.com' \
            --data-urlencode 'name=Ramtin website diagnostic' \
            --data-urlencode 'email=Ramtin.Mojtahedi@utoronto.ca' \
            --data-urlencode 'reply_to=Ramtin.Mojtahedi@utoronto.ca' \
            --data-urlencode 'subject=RM-WEBSITE-DIAGNOSTIC-20260727-1925Z' \
            --data-urlencode 'message=This is a one-time real delivery test for the website contact form endpoint.' \
            --data-urlencode 'website=https://ramtin-mojtahedi.github.io/' \
            --data-urlencode 'hp_email=' \
            'https://email.gosecureserver.in/api/send.php')"

          echo "HTTP status: ${status}"
          cat "$response_file"
          echo

          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            exit 1
          fi
