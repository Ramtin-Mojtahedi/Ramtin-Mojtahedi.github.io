name: Prepare source-linked news pictures
on:
  push:
    branches: [latest-news-pictures-20260913]
    paths:
      - scripts/prepare_news_pictures.py
      - assets/news-media.css
      - .github/workflows/prepare-news-pictures.yml
permissions:
  contents: write
concurrency:
  group: prepare-news-pictures
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: latest-news-pictures-20260913
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare and validate reviewed news content
        shell: bash
        run: |
          set -euo pipefail
          pip install 'Pillow>=11,<13'
          python - <<'PY'
          from pathlib import Path
          file = Path('scripts/prepare_news_pictures.py')
          code = file.read_text(encoding='utf-8').replace('width * height > 25000000', 'width * height > 80000000')
          code = code.replace('raise ValueError("Unexpected image dimensions")', 'raise ValueError(f"Unexpected image dimensions: {width}x{height}; {len(data)} bytes")')
          file.write_text(code, encoding='utf-8')
          PY
          python scripts/prepare_news_pictures.py 2>&1 | tee news-picture-provenance.txt
          # Workflow changes are reviewed and applied separately through the owner connection.
          git restore .github/workflows/news-carousel-audit.yml
          python scripts/validate_website.py
          python scripts/validate_layout_safety.py
          python scripts/build_search_pages.py --check
          python scripts/render_visual_audit.py
          python -m py_compile scripts/prepare_news_pictures.py
          node --check assets/news-carousel.js
      - name: Preserve source images for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-picture-sources
          path: |
            assets/news
            assets/ramtin-graduation.svg
            _data/news.json
            news-picture-provenance.txt
          retention-days: 7
      - name: Commit requested content to the preparation branch
        shell: bash
        run: |
          set -euo pipefail
          git add assets/news assets/news-carousel.js _data/news.json _includes/site-part-1.html index.html scripts/prepare_news_pictures.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Show latest verified news with source-linked pictures in the carousel'
            git pull --rebase origin latest-news-pictures-20260913
            git push origin HEAD:latest-news-pictures-20260913
          fi
