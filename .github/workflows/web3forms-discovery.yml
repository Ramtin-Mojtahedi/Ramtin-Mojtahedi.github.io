name: One-time Web3Forms endpoint discovery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/web3forms-discovery.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect public Web3Forms application assets
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          curl -A "$ua" -L --retry 3 --retry-delay 3 -D "$work/headers.txt" -o "$work/app.html" https://app.web3forms.com/ || true
          {
            echo '=== RESPONSE HEADERS ==='
            cat "$work/headers.txt" 2>/dev/null || true
            echo
            echo '=== HTML EXCERPT ==='
            head -c 12000 "$work/app.html" 2>/dev/null || true
            echo
            echo '=== SCRIPT SOURCES ==='
          } > .github/web3forms-discovery.txt

          python - "$work" <<'PY'
          import re, sys, urllib.parse
          from pathlib import Path
          root = Path(sys.argv[1])
          html = (root/'app.html').read_text(encoding='utf-8', errors='replace') if (root/'app.html').exists() else ''
          srcs = re.findall(r'<script[^>]+src=["\']([^"\']+)', html, flags=re.I)
          resolved=[]
          for src in srcs:
              url=urllib.parse.urljoin('https://app.web3forms.com/', src)
              if url not in resolved:
                  resolved.append(url)
          (root/'scripts.txt').write_text('\n'.join(resolved), encoding='utf-8')
          with open('.github/web3forms-discovery.txt','a',encoding='utf-8') as out:
              for url in resolved:
                  out.write(url+'\n')
          PY

          n=0
          while IFS= read -r src; do
            [ -n "$src" ] || continue
            n=$((n+1))
            file="$work/script-$n.js"
            curl -A "$ua" -L --retry 2 --retry-delay 2 -o "$file" "$src" || true
            {
              echo
              echo "=== MATCHES FROM $src ==="
              grep -Eo '.{0,100}(access.?key|api\.web3forms\.com|create.?form|verification|verify.?email|send.?key|email).{0,160}' "$file" 2>/dev/null | head -n 200 || true
            } >> .github/web3forms-discovery.txt
          done < "$work/scripts.txt"

      - name: Commit discovery report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/web3forms-discovery.txt
          git commit -m 'Record Web3Forms public endpoint discovery' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
