name: Create Altena Studio branded short URL

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-short-link:
    runs-on: ubuntu-latest
    steps:
      - name: Create and verify branded redirect
        shell: bash
        run: |
          set -u

          destination="https://ramtin-mojtahedi.github.io/altena-studio/"

          verify_url() {
            local short_url="$1"
            local final_url
            final_url="$(curl --location --silent --show-error --output /dev/null --write-out '%{url_effective}' "${short_url}" || true)"
            echo "VERIFY ${short_url} -> ${final_url}"
            [[ "${final_url}" == "${destination}" || "${final_url}" == "${destination%/}" ]]
          }

          for alias in AltenaStudio AltenaStudioHQ AltenaStudioGo AltenaLinks StudioAltena; do
            payload="{\"long_url\":\"${destination}\",\"alias\":\"${alias}\"}"
            response="$(curl --silent --show-error --write-out $'\n%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json' \
              --data "${payload}" \
              https://spoo.me/api/v1/shorten || true)"
            status="$(printf '%s\n' "${response}" | tail -n 1)"
            body="$(printf '%s\n' "${response}" | sed '$d')"
            echo "SPOO ${alias} HTTP ${status}: ${body}"

            if [[ "${status}" == "201" ]]; then
              short_url="$(printf '%s' "${body}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("short_url",""))')"
              if [[ "${short_url}" == https://spoo.me/* ]] && verify_url "${short_url}"; then
                echo "VERIFIED_ALTENA_STUDIO_URL=${short_url}"
                exit 0
              fi
            fi
          done

          for host in v.gd is.gd; do
            for alias in AltenaStudio AltenaStudioHQ AltenaStudioGo AltenaLinks StudioAltena; do
              response="$(curl --silent --show-error --get \
                --data-urlencode 'format=simple' \
                --data-urlencode "url=${destination}" \
                --data-urlencode "shorturl=${alias}" \
                "https://${host}/create.php" || true)"
              echo "${host} ${alias}: ${response}"

              if [[ "${response}" == "https://${host}/"* ]] && verify_url "${response}"; then
                echo "VERIFIED_ALTENA_STUDIO_URL=${response}"
                exit 0
              fi
            done
          done

          echo "No branded redirect could be created and verified." >&2
          exit 1
