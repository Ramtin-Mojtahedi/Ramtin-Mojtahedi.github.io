name: Validate portfolio website

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - sitemap.xml
      - publications.json
      - _includes/**
      - _data/**
      - assets/**
      - scripts/**
      - .github/workflows/site-quality.yml
  pull_request:
    paths:
      - index.html
      - sitemap.xml
      - publications.json
      - _includes/**
      - _data/**
      - assets/**
      - scripts/**
      - .github/workflows/site-quality.yml
  workflow_dispatch:
  schedule:
    - cron: "47 11 * * *"

permissions:
  contents: read

concurrency:
  group: portfolio-site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out website repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate website structure, content, and data
        run: python scripts/validate_website.py

      - name: Validate Python and JavaScript syntax
        run: |
          python -m py_compile scripts/*.py
          node --check assets/site-2026.js
          node --check assets/site-polish.js
          node --check assets/site-pointer-scroll.js
          node --check assets/publication-runtime.js
          node --check assets/contact-form.js

      - name: Record validation summary
        run: |
          {
            echo "### Portfolio validation passed"
            echo "- Required public sections and internal links: valid"
            echo "- Publication data and all public counters: synchronized"
            echo "- Contact routing and safeguards: valid"
            echo "- Visitor-facing implementation markers: absent"
            echo "- Daily maintenance configuration: valid"
            echo "- JavaScript and Python syntax: valid"
          } >> "$GITHUB_STEP_SUMMARY"
