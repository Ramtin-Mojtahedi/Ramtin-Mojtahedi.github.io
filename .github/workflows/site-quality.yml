name: Validate portfolio website

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - sitemap.xml
      - publications.json
      - _includes/**
      - _data/**
      - assets/**
      - scripts/**
      - .github/workflows/site-quality.yml
  pull_request:
    paths:
      - index.html
      - sitemap.xml
      - publications.json
      - _includes/**
      - _data/**
      - assets/**
      - scripts/**
      - .github/workflows/site-quality.yml
  workflow_dispatch:
  schedule:
    - cron: "47 11 * * *"

permissions:
  contents: read

concurrency:
  group: portfolio-site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out website repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run website validation
        id: website_validation
        shell: bash
        run: |
          set +e
          python scripts/validate_website.py > validation-report.txt 2>&1
          website_exit=$?
          python scripts/validate_service_roles.py >> validation-report.txt 2>&1
          service_exit=$?
          python scripts/validate_site_impact.py >> validation-report.txt 2>&1
          impact_exit=$?
          python scripts/validate_layout_safety.py >> validation-report.txt 2>&1
          layout_exit=$?
          exit_code=0
          if [[ "$website_exit" -ne 0 || "$service_exit" -ne 0 || "$impact_exit" -ne 0 || "$layout_exit" -ne 0 ]]; then
            exit_code=1
          fi
          cat validation-report.txt
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload failure report
        if: steps.website_validation.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: website-validation-report
          path: validation-report.txt
          retention-days: 7

      - name: Enforce website validation
        if: steps.website_validation.outputs.exit_code != '0'
        run: exit 1

      - name: Validate Python and JavaScript syntax
        run: |
          python -m py_compile scripts/*.py
          node --check assets/site-2026.js
          node --check assets/site-polish.js
          node --check assets/site-pointer-scroll.js
          node --check assets/publication-runtime.js
          node --check assets/programming-languages.js
          node --check assets/site-impact.js
          node --check assets/contact-form.js
          node --check assets/layout-safety.js
          node --check scripts/visual_layout_audit.mjs

      - name: Install Chromium for rendered layout audit
        run: |
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Render website for browser audit
        id: render_audit
        shell: bash
        run: |
          set +e
          python scripts/render_visual_audit.py > render-audit-report.txt 2>&1
          exit_code=$?
          cat render-audit-report.txt
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload render diagnostics
        if: steps.render_audit.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit-render-report
          path: render-audit-report.txt
          retention-days: 7

      - name: Enforce audit-page rendering
        if: steps.render_audit.outputs.exit_code != '0'
        run: exit 1

      - name: Run rendered multi-viewport layout audit
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/visual-audit-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/visual-audit.html > /dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              cat /tmp/visual-audit-server.log
              exit 1
            fi
            sleep 1
          done

          VISUAL_AUDIT_URL=http://127.0.0.1:4173/visual-audit.html \
            node scripts/visual_layout_audit.mjs

      - name: Upload visual layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-layout-audit
          path: |
            render-audit-report.txt
            visual-audit-report.json
            visual-audit-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Record validation summary
        run: |
          {
            echo "### Portfolio validation passed"
            echo "- Required public sections and internal links: valid"
            echo "- Publication data and all public counters: synchronized"
            echo "- Statistics and section hierarchy: clear and interactive"
            echo "- Leadership and volunteer roles: complete and unique"
            echo "- Contact routing and safeguards: valid"
            echo "- Visitor-facing implementation markers: absent"
            echo "- Responsive and reduced-motion behavior: valid"
            echo "- Rendered browser overlap audit: passed at 320–1600 px"
            echo "- Mobile menu, expanded awards, and dark theme: verified"
            echo "- Daily maintenance configuration: valid"
            echo "- JavaScript and Python syntax: valid"
          } >> "$GITHUB_STEP_SUMMARY"
