name: Daily website content maintenance check

on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * *"

permissions:
  contents: read

concurrency:
  group: portfolio-content-maintenance-check
  cancel-in-progress: true

jobs:
  audit-website:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-publications.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install maintenance dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-publications.txt

      - name: Build a temporary candidate refresh
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_publications.py | tee publication-sync-report.json
          python scripts/clean_publications.py
          python scripts/repair_site_stats.py
          python scripts/refresh_site_maintenance.py
          python scripts/build_search_pages.py

      - name: Validate the candidate website
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_website.py
          python scripts/validate_service_roles.py
          python scripts/validate_site_impact.py
          python scripts/validate_layout_safety.py
          python scripts/build_search_pages.py --check
          python -m py_compile scripts/*.py
          node --check assets/site-2026.js
          node --check assets/site-polish.js
          node --check assets/site-pointer-scroll.js
          node --check assets/publication-runtime.js
          node --check assets/programming-languages.js
          node --check assets/site-impact.js
          node --check assets/contact-form.js
          node --check assets/layout-safety.js
          node --check scripts/visual_layout_audit.mjs
          node --check scripts/visual_heading_audit.mjs

      - name: Record candidate changes without modifying production
        shell: bash
        run: |
          set -euo pipefail
          git status --short > maintenance-changes.txt
          {
            echo "### Daily website maintenance check completed"
            if [[ -s maintenance-changes.txt ]]; then
              echo "Candidate updates were found. Review the attached report before applying them."
              echo '~~~text'
              cat maintenance-changes.txt
              echo '~~~'
            else
              echo "No verified content or metadata changes were detected."
            fi
            echo "The scheduled check is read-only and did not commit or push files."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload maintenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-maintenance-check
          path: |
            publication-sync-report.json
            maintenance-changes.txt
          if-no-files-found: warn
          retention-days: 14
