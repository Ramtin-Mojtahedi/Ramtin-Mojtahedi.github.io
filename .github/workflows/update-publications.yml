name: Daily website content maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * *"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "_includes/**"
      - "_data/**"
      - "assets/**"
      - "scripts/**"
      - "publications.json"
      - "publications/**"
      - "indexnow.json"
      - "sitemap.xml"
      - ".github/workflows/update-publications.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: portfolio-content-maintenance
  cancel-in-progress: true

jobs:
  maintain-website:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-publications.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install maintenance dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-publications.txt

      - name: Check scholarly sources
        run: |
          set -euo pipefail
          python scripts/update_publications.py | tee publication-sync-report.json

      - name: Remove non-publication records
        run: python scripts/clean_publications.py

      - name: Synchronize all public counters and headings
        run: python scripts/repair_site_stats.py

      - name: Refresh internal maintenance data and search files
        run: python scripts/refresh_site_maintenance.py

      - name: Build crawler-readable publication pages
        run: python scripts/build_search_pages.py

      - name: Validate the complete website
