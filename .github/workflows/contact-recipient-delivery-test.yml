name: One-time corrected contact recipient test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/contact-recipient-delivery-test.yml

permissions:
  contents: write

jobs:
  test-corrected-recipient:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Submit one real contact-form test to the corrected mailbox
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl \
            --location \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --data-urlencode 'to=mojtahediramtin@gmail.com' \
            --data-urlencode 'name=Ramtin Mojtahedi Website' \
            --data-urlencode 'email=Ramtin.Mojtahedi@utoronto.ca' \
            --data-urlencode 'reply_to=Ramtin.Mojtahedi@utoronto.ca' \
            --data-urlencode 'inquiry_type=Other professional inquiry' \
            --data-urlencode 'subject=Ramtin website contact form test — corrected recipient' \
            --data-urlencode 'message=This is a one-time delivery test after correcting the contact-form recipient to mojtahediramtin@gmail.com.' \
            --data-urlencode 'reference=RM-CORRECTED-RECIPIENT-TEST' \
            --data-urlencode 'website=https://ramtin-mojtahedi.github.io/' \
            --data-urlencode 'from_name=Ramtin Mojtahedi Website' \
            --data-urlencode 'hp_email=' \
            'https://email.gosecureserver.in/api/send.php')"

          python - "$status" "$response_file" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          status = int(sys.argv[1])
          body = Path(sys.argv[2]).read_text(encoding='utf-8', errors='replace')
          result = {
              'checked_at': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'recipient': 'mojtahediramtin@gmail.com',
              'endpoint': 'https://email.gosecureserver.in/api/send.php',
              'http_status': status,
              'relay_accepted': 200 <= status < 300,
              'response_excerpt': body[:500],
              'subject': 'Ramtin website contact form test — corrected recipient',
          }
          Path('.github/contact-recipient-delivery-test-result.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          if not result['relay_accepted']:
              raise SystemExit(1)
          PY

      - name: Record corrected recipient test result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/contact-recipient-delivery-test-result.json
          git commit -m 'Record corrected contact recipient delivery test' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
